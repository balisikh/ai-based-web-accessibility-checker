name: Batch rescan

on:
  schedule:
    # Weekly Sunday 04:00 UTC — live rescan of all 28 portfolio sites
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-rescan
  cancel-in-progress: false

jobs:
  sync-snapshot:
    name: Live rescan and commit snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run batch sync (rescan → apply → validate)
        run: npm run batch:sync
        env:
          PLAYWRIGHT_CHROMIUM: "1"
          CI: "true"

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/website-batch-results.ts
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: sync batch snapshot from scheduled live rescan"
          git pull --rebase origin main
          git push
