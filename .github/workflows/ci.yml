name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One active run per PR (supersede old commits). Each push to main gets its own SHA group so runs are not canceled mid-flight.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.event.pull_request.number)
        || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, batch snapshot, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Validate batch snapshot (28 sites)
        run: npm run validate:batch

      - name: Production build
        run: npm run build

  responsive-viewport:
    name: Viewport overflow check
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Download Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Download Playwright Chromium (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Start production server
        run: npm run start &
        env:
          HOSTNAME: 127.0.0.1

      - name: Wait for health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4376/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready"
          exit 1

      - name: Responsive viewport check
        run: npm run test:responsive
        env:
          BASE_URL: http://127.0.0.1:4376
          CI: "true"
          PLAYWRIGHT_CHROMIUM: "1"
